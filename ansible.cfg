[defaults]
# Site config (inventory + group_vars/ + host_vars/ + ssh_pubkeys/) lives in a separate,
# PRIVATE repo checked out next to this one; group_vars/host_vars load relative to it.
# See QUICKSTART.md "2. Private configuration". Override per run with -i <path>.
inventory = ../ansible-private/inventory.ini
roles_path = ./roles
host_key_checking = false
gathering = explicit
executable = /bin/bash

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ConnectTimeout=10
