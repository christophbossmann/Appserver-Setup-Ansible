---
# Set passwords for Authentik accounts that blueprints create but cannot give a
# password to. Two policies:
#   - service accounts (authentik_service_accounts): CONVERGENT — password set every
#     run (bots; nobody self-manages them).
#   - human users (authentik_users) that declare a `password`: INITIAL-ONLY — set
#     only when the account has NO usable password yet, so a user who has since set
#     their own is never overwritten. Humans without `password` are skipped (they
#     self-set via SSO / an Authentik recovery link).
#
# Blueprints apply asynchronously, so we WAIT (retries) for each account to exist.
# A transient delay (e.g. the outpost-update deadlock on first create) must NOT
# abort the play -> failed_when: false on the lookup + a guarded set.

- name: Build the managed-account list (service=convergent, human=initial)
  ansible.builtin.set_fact:
    _ak_accounts: >-
      {{ (authentik_service_accounts | default([]) | map('combine', {'mode': 'convergent'}) | list)
         + (authentik_users | default([]) | selectattr('password', 'defined')
            | map('combine', {'mode': 'initial'}) | list) }}

# Password overwrite selector (opt-in). Normally human passwords are INITIAL-ONLY.
# authentik_passwordsync forces a re-set from the vault, OVERWRITING the user's
# current password — normally undesired, but handy for a forced reset. Accepts:
#   false (default) = never overwrite (initial-only stays)
#   true            = overwrite ALL humans that declare a password
#   "Bob" / [Bob,Carol] = overwrite only those usernames  (surgical)
- name: Normalize the password-sync selector
  ansible.builtin.set_fact:
    _pwsync_all: "{{ ((authentik_passwordsync | default(false)) is boolean) and (authentik_passwordsync | default(false) | bool) }}"
    _pwsync_users: >-
      {{ [] if ((authentik_passwordsync | default(false)) is boolean)
         else ((authentik_passwordsync.split(',') | map('trim') | select | list) if (authentik_passwordsync is string)
               else (authentik_passwordsync | list)) }}

- name: NOTICE — password overwrite is ACTIVE this run
  ansible.builtin.debug:
    msg: >-
      authentik_passwordsync active -> the declared vault password will OVERWRITE the
      current password for: {{ 'ALL declared-password humans' if (_pwsync_all | bool) else _pwsync_users }}
      (service accounts are always overwritten anyway).
  when: (_pwsync_all | bool) or ((_pwsync_users | length) > 0)

- name: Resolve account id + password status (wait for the blueprint; tolerant)
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-postgres
      - psql
      - -U
      - authentik
      - -d
      - authentik
      - -tAc
      - "select id || '|' || (case when password like 'pbkdf2%' then 'usable' else 'unset' end) from authentik_core_user where username = '{{ item.username }}'"
  register: _ak_acc
  changed_when: false
  failed_when: false          # tolerant: a delayed account must not abort the play
  loop: "{{ _ak_accounts }}"
  loop_control:
    label: "{{ item.username }}"
  until: (_ak_acc.stdout | default('') | trim) | length > 0
  # A FRESH Authentik boot runs all migrations + imports every default AND custom
  # blueprint before our users exist — that can take minutes. 60x5s = 5 min margin
  # (a first fresh deploy nearly exhausted the old 30x5=150s).
  retries: "{{ authentik_bootstrap_resolve_retries | default(60) }}"
  delay: 5
  when:
    - _ak_accounts | length > 0
    - not ansible_check_mode

- name: Warn about accounts the blueprint still hasn't created (password set SKIPPED)
  # Make the silent skip visible: if the wait above still timed out for an account,
  # its password is not set below (when: stdout length > 0). Re-run --tags authentik.
  ansible.builtin.debug:
    msg: >-
      WARNING: '{{ item.item.username }}' was not found in Authentik after the wait —
      its password was NOT set. Re-run `--tags authentik` once the blueprint has applied.
  loop: "{{ _ak_acc.results | default([]) }}"
  loop_control:
    label: "{{ item.item.username }}"
  when:
    - _ak_accounts | length > 0
    - not ansible_check_mode
    - (item.stdout | default('') | trim) | length == 0

- name: Set account passwords (convergent for bots, initial-only for humans)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/core/users/{{ (item.0.stdout | trim).split('|')[0] }}/set_password/"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_authentik_bootstrap_token }}"
    body_format: json
    body:
      password: "{{ item.1.password }}"
    status_code: [204]
  register: _ak_setpw
  until: _ak_setpw is not failed          # ride out transient API unavailability (server restart)
  retries: 12
  delay: 5
  loop: "{{ _ak_acc.results | default([]) | zip(_ak_accounts) | list }}"
  loop_control:
    label: "{{ item.1.username }} ({{ item.1.mode }})"
  # initial-set + any forced overwrite is a real change; a plain convergent bot re-set
  # just ensures state and isn't flagged.
  changed_when: "item.1.mode == 'initial' or (_pwsync_all | bool) or (item.1.username in _pwsync_users)"
  no_log: true
  when:
    - _ak_accounts | length > 0
    - not ansible_check_mode
    - (item.0.stdout | default('') | trim) | length > 0
    # set when: bot (convergent) OR account has no usable password yet (initial) OR
    # password-sync forces an overwrite for this account.
    - >-
      item.1.mode == 'convergent'
      or (item.0.stdout | trim).split('|')[1] == 'unset'
      or (_pwsync_all | bool)
      or (item.1.username in _pwsync_users)

- name: Warn about accounts the blueprint hasn't created yet (re-run to finish)
  ansible.builtin.debug:
    msg: "Account '{{ item.0.item.username }}' not found yet (blueprint still applying?) — re-run --tags authentik to set its password."
  loop: "{{ _ak_acc.results | default([]) | zip(_ak_accounts) | list }}"
  loop_control:
    label: "{{ item.1.username }}"
  when:
    - _ak_accounts | length > 0
    - not ansible_check_mode
    - (item.0.stdout | default('') | trim) | length == 0
