---
# === Default playground app (per environment) =======================================
# For every environment, seed its workspace subdir with a tiny "Welcome to
# Playground" page on that env's public port and bring it up via the broker, so
# each <env>.<host> route has a backend out of the box.
#
# force: false -> if a docker-compose.yml already exists (e.g. the AI replaced
# it), it is left untouched. Bringing it "up" is idempotent and simply starts
# whatever stack currently lives in that env's workspace.

- name: Seed the default compose per environment (only if none exists)
  ansible.builtin.template:
    src: landing-compose.yml.j2
    dest: "{{ playground_ctl_workspace }}/{{ item }}/docker-compose.yml"
    owner: "{{ playground_ctl_user }}"
    group: "{{ playground_ctl_user }}"
    mode: "0664"
    force: false
  loop: "{{ playground_environments }}"
  loop_control:
    index_var: _pg_idx
  vars:
    _pg_env: "{{ item }}"
    _pg_port: "{{ playground_env_base_port + _pg_idx }}"

- name: Seed the default landing page per environment (only if none exists)
  ansible.builtin.copy:
    src: landing-index.html
    dest: "{{ playground_ctl_workspace }}/{{ item }}/index.html"
    owner: "{{ playground_ctl_user }}"
    group: "{{ playground_ctl_user }}"
    mode: "0644"   # world-readable so the nginx container can serve it
    force: false
  loop: "{{ playground_environments }}"

# Uses the broker on purpose (dogfoods the exact path the AI uses). Runs as root,
# which owns the broker socket. Idempotent: a no-op if the stack is already up.
- name: Ensure every environment's workspace stack is running
  ansible.builtin.command:
    cmd: "{{ playground_ctl_bin }} playground compose up --env {{ item }}"
  register: _pgctl_app_up
  changed_when: "(_pgctl_app_up.stdout + _pgctl_app_up.stderr) is search('Started|Creating|Created|Recreating|Recreated|Built')"
  failed_when: _pgctl_app_up.rc != 0
  loop: "{{ playground_environments }}"

- name: Default playground apps
  ansible.builtin.debug:
    msg: >-
      Playground environments up: {{ playground_environments | join(', ') }}.
      Each <env>.<host> route proxies to its port
      ({{ playground_env_base_port }}+index). Replace
      {{ playground_ctl_workspace }}/<env>/docker-compose.yml to run something
      else (keep publishing on that env's 127.0.0.1 port). Target an env with
      `playgroundctl playground compose up --env <env>`.
