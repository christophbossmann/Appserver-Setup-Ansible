# WebDAV access to the playground workspace (opt-in via playground_webdav_enabled).
# Serves the workspace ROOT, so all environments' subdirs are visible under it.
# Add 'webdav_playground' to the host's caddy_services to expose it.
# Port must match playground_webdav_port (default 8091).
caddy_route_webdav_playground:
  name: webdav-playground
  depends_service: playground   # playground workspace webdav (intent-aware post-check)
  hostname_label: webdav-playground
  caddy_upstream: "127.0.0.1:8091"
  # In LDAP mode the WebDAV container (rclone --auth-proxy) authenticates against
  # Authentik itself, so Caddy must NOT run its own basic_auth — it would intercept
  # the Authorization header and reject the LDAP credentials before they ever reach
  # the container. Only the fixed-credential fallback (playground_webdav_ldap: false)
  # gets a Caddy basic_auth gate. (Rendered lazily, so {% if %} sees the toggle.)
  caddy_extra: |
    {% if not (playground_webdav_ldap | default(false)) %}
    # matches playground_webdav_user / vault_playground_webdav_password
    basic_auth {
      {{ admin_user }} {{ vault_basicauth_webdav_playground | password_hash('bcrypt', caddy_basicauth_salt, rounds=caddy_basicauth_rounds) }}
    }
    {% endif %}
