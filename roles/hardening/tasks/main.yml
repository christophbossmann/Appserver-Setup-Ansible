---
- name: Hostname
  ansible.builtin.import_tasks: hostname.yml
  tags: [hostname]

# ==========================================================
# Phase 0: Time Sync (must run before apt to avoid "not valid yet" errors)
# Handles all cases: chrony already installed, timesyncd available, or neither.
# No apt install required — works on any Ubuntu server state.
# ==========================================================
- name: Force initial clock sync
  ansible.builtin.shell: |
    # Case 1: chrony already installed and running (e.g. from a previous partial run)
    if systemctl is-active --quiet chrony 2>/dev/null; then
      chronyc -a makestep
    # Case 2: chrony installed but not yet started
    elif command -v chronyc &>/dev/null; then
      systemctl start chrony
      chronyc -a makestep
    # Case 3: systemd-timesyncd available and not masked
    elif systemctl list-unit-files systemd-timesyncd.service 2>/dev/null | grep -qv masked; then
      systemctl enable --now systemd-timesyncd
      timedatectl set-ntp true
      for i in $(seq 1 12); do
        [ "$(timedatectl show --property=NTPSynchronized --value 2>/dev/null)" = "yes" ] && break
        sleep 5
      done
    # Case 4: last resort — set time from an HTTP Date header (http:// -> no TLS,
    # so it works even with a wrong clock). Try several diverse hosts; first wins.
    else
      for url in http://www.google.com http://www.cloudflare.com http://www.microsoft.com http://example.com; do
        DATE=$(curl -sI --max-time 5 "$url" 2>/dev/null | awk -F': ' 'tolower($1)=="date"{print $2; exit}' | tr -d '\r')
        if [ -n "$DATE" ]; then date -s "$DATE" && break; fi
      done
    fi
  args:
    executable: /bin/bash
  changed_when: false

# ----------------------------------------------------------
# Phase 0b: Verify the clock actually converged. Abort EARLY and CLEARLY if not,
# instead of letting a later TLS download fail with the cryptic
# "certificate is not yet valid". Reference is the online time (HTTP Date header
# over http:// -> no TLS, so it works even with a wrong clock); if the host has
# no internet, we fall back to the Ansible controller's clock.
# ----------------------------------------------------------
- name: Determine reference time (online HTTP Date header, no TLS)
  ansible.builtin.shell: |
    set -o pipefail
    for url in http://www.google.com http://www.cloudflare.com http://www.microsoft.com http://example.com; do
      d=$(curl -sI --max-time 5 "$url" 2>/dev/null | awk -F': ' 'tolower($1)=="date"{print $2; exit}' | tr -d '\r')
      [ -n "$d" ] && { date -u -d "$d" +%s && exit 0; }
    done
    exit 1
  args:
    executable: /bin/bash
  register: _clock_ref_online
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe; without it --check sees an empty result

- name: Capture managed host clock (epoch, UTC)
  ansible.builtin.command: date -u +%s
  register: _clock_host
  changed_when: false
  check_mode: false   # read-only probe; the skew assert below needs real data

- name: Abort if host clock is not roughly in sync with reference time
  vars:
    _have_online: "{{ _clock_ref_online.rc == 0 and (_clock_ref_online.stdout | trim) != '' }}"
    _ref: "{{ (_clock_ref_online.stdout | trim) if _have_online else lookup('pipe', 'date -u +%s') }}"
    _src: "{{ 'online time' if _have_online else 'Ansible controller clock' }}"
    _skew: "{{ (_clock_host.stdout | int) - (_ref | int) }}"
  ansible.builtin.assert:
    that:
      - _skew | int | abs <= clock_skew_max_seconds | int
    fail_msg: >-
      Clock skew too large: this host is {{ _skew }} s off the {{ _src }}
      (limit ±{{ clock_skew_max_seconds }} s). Time sync did not converge, so TLS
      operations (tailscale / apt / caddy ACME) would fail with
      'certificate is not yet valid'. Fix NTP on the host
      (sudo timedatectl set-ntp true; check chrony/timesyncd) and re-run.
    success_msg: "Clock OK: {{ _skew }} s vs {{ _src }} (limit ±{{ clock_skew_max_seconds }} s)."
  changed_when: false

# ----------------------------------------------------------
# Phase 0c: Quiesce background apt so it can't hold the dpkg lock mid-play.
# unattended-upgrades / apt-daily can fire (especially right after a clock fix
# catches up a backlog) and hold /var/lib/dpkg/lock-frontend, breaking later
# apt operations (tailscale install.sh, docker, ...) with a cryptic rc=100.
# We stop the TIMERS (no new runs this play) and WAIT for any in-flight run to
# finish gracefully -- we do NOT kill it mid-dpkg.
# They MUST come back: a stopped timer stays stopped until reboot, i.e. no automatic
# (security) updates. The playbooks restart them in post_tasks
# (playbooks/tasks/apt_timers_restore.yml, after every role); the transient systemd
# timer below is the safety net for a play that aborts before reaching post_tasks.
# ----------------------------------------------------------
- name: Stop apt background timers for the duration of this play
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  failed_when: false

- name: Safety net — re-start the apt timers in 3h even if this play aborts
  ansible.builtin.shell: |
    systemctl stop apt-timers-restore.timer apt-timers-restore.service 2>/dev/null || true
    systemctl reset-failed apt-timers-restore.service 2>/dev/null || true
    systemd-run --unit=apt-timers-restore --on-active=3h \
      /bin/systemctl start apt-daily.timer apt-daily-upgrade.timer
  changed_when: false

- name: Wait for any in-flight apt/dpkg lock to be released
  ansible.builtin.shell: |
    set -o pipefail
    deadline=$(( $(date +%s) + {{ apt_lock_wait_seconds | default(300) }} ))
    while :; do
      if ! fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
                  /var/lib/apt/lists/lock >/dev/null 2>&1; then
        exit 0
      fi
      if [ "$(date +%s)" -ge "$deadline" ]; then
        echo "apt/dpkg lock still held after {{ apt_lock_wait_seconds | default(300) }}s by:" >&2
        fuser -v /var/lib/dpkg/lock-frontend >&2 2>&1 || true
        echo "" >&2
        echo "Usually unattended-upgrades clearing a backlog (e.g. right after a clock fix)." >&2
        echo "Do NOT kill it mid-dpkg. Watch it, wait for the lock to free, then re-run this play:" >&2
        echo "  sudo journalctl -u apt-daily-upgrade.service -f" >&2
        echo "  sudo tail -f /var/log/unattended-upgrades/unattended-upgrades.log" >&2
        echo "  sudo fuser /var/lib/dpkg/lock-frontend   # empty output = lock free -> safe to re-run" >&2
        echo "Or give it more time on the next run:  -e apt_lock_wait_seconds=1200" >&2
        exit 1
      fi
      sleep 5
    done
  args:
    executable: /bin/bash
  changed_when: false

# ==========================================================
# Phase 1: Base Packages
# ==========================================================
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ hardening_base_packages }}"
    state: present

- name: Enable unattended-upgrades
  ansible.builtin.dpkg_selections:
    name: unattended-upgrades
    selection: install

- name: Ensure atd is running (needed for rollback safety)
  ansible.builtin.systemd:
    name: atd
    enabled: true
    state: started

- name: Ensure chrony is running (replaces systemd-timesyncd as NTP daemon)
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Force time sync via chrony
  ansible.builtin.command: chronyc -a makestep
  changed_when: false

# ==========================================================
# Phase 2: Swap
# ==========================================================
- name: Configure swap
  when: hardening_swap_enabled
  block:
    # How much swap is already active EXCLUDING our own managed file? (e.g. the Ubuntu
    # btrfs installer creates /swap.img). If that's already >= what we'd provide, we
    # don't add a redundant swapfile — and we remove ours if a past run made one.
    - name: Measure active swap that is NOT our managed swapfile (MB)
      ansible.builtin.shell: >-
        swapon --show=NAME,SIZE --bytes --noheadings
        | awk -v me='{{ hardening_swap_path }}' '$1 != me {s += $2} END {print int(s/1048576)}'
      register: _swap_other_mb
      changed_when: false
      check_mode: false

    - name: Existing swap is sufficient — skip + remove our managed swapfile
      when: (_swap_other_mb.stdout | trim | int) >= (hardening_swap_size_mb | int)
      block:
        - name: Disable + delete the managed swapfile (if present)
          ansible.builtin.shell: |
            set -e
            P="{{ hardening_swap_path }}"
            swapon --show=NAME --noheadings | grep -Fxq "$P" && swapoff "$P" || true
            rm -f "$P"
          args:
            executable: /bin/bash
          changed_when: true

        - name: Drop the managed swapfile from fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '^{{ hardening_swap_path | regex_escape }}\s'
            state: absent

        - name: Note — existing swap covers it
          ansible.builtin.debug:
            msg: >-
              {{ _swap_other_mb.stdout | trim }} MB of swap already active
              (>= {{ hardening_swap_size_mb }} MB) — not adding {{ hardening_swap_path }}.

    - name: Not enough swap — create our managed swapfile
      when: (_swap_other_mb.stdout | trim | int) < (hardening_swap_size_mb | int)
      block:
        - name: Is our swapfile already active?
          ansible.builtin.shell: "swapon --show=NAME --noheadings | grep -Fxq '{{ hardening_swap_path }}'"
          register: _swap_active
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Create + enable the swapfile (btrfs-aware) when not active
          # btrfs rejects a plain fallocate'd swapfile ("swapon: Invalid argument") — it
          # requires NODATACOW (chattr +C on the empty file) + written with dd, not
          # fallocate. Detect the fs and branch. Self-heals a stale/half-made file too.
          ansible.builtin.shell: |
            set -e
            P="{{ hardening_swap_path }}"
            [ -e "$P" ] && rm -f "$P"
            FSTYPE=$(findmnt -no FSTYPE --target "$(dirname "$P")")
            if [ "$FSTYPE" = "btrfs" ]; then
              truncate -s 0 "$P"
              chattr +C "$P"               # nodatacow — MUST be set while the file is empty
              dd if=/dev/zero of="$P" bs=1M count={{ hardening_swap_size_mb }} status=none
            else
              fallocate -l {{ hardening_swap_size_mb }}M "$P"
            fi
            chmod 600 "$P"
            mkswap "$P"
            swapon "$P"
          args:
            executable: /bin/bash
          when: _swap_active.rc != 0
          changed_when: true

        - name: Persist swapfile in fstab
          ansible.builtin.lineinfile:
            path: /etc/fstab
            line: "{{ hardening_swap_path }} none swap sw 0 0"
            state: present

    - name: Set vm.swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ hardening_swap_swappiness }}"
        state: present
        reload: true

    - name: Set vm.vfs_cache_pressure
      ansible.posix.sysctl:
        name: vm.vfs_cache_pressure
        value: "{{ hardening_swap_vfs_cache_pressure }}"
        state: present
        reload: true

# ==========================================================
# Phase 3: Fail2Ban
# ==========================================================
- name: Install Fail2Ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Deploy Caddy/Immich share basic-auth fail2ban filter
  ansible.builtin.template:
    src: filter-caddy-immich.conf.j2
    dest: /etc/fail2ban/filter.d/caddy-immich.conf
    owner: root
    group: root
    mode: "0644"
  when: hardening_fail2ban_caddy_immich_enabled | default(false)
  notify: Restart Fail2Ban

- name: Deploy Caddy/ntfy login fail2ban filter
  ansible.builtin.template:
    src: filter-caddy-ntfy.conf.j2
    dest: /etc/fail2ban/filter.d/caddy-ntfy.conf
    owner: root
    group: root
    mode: "0644"
  when: hardening_fail2ban_caddy_ntfy_enabled | default(false)
  notify: Restart Fail2Ban

- name: Configure Fail2Ban jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart Fail2Ban

# How long fail2ban remembers past bans — the window in which bans escalate.
- name: Configure Fail2Ban ban history (dbpurgeage)
  ansible.builtin.copy:
    dest: /etc/fail2ban/fail2ban.local
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/hardening). Ban history window for escalating bans.
      [Definition]
      dbpurgeage = {{ hardening_fail2ban_dbpurgeage }}
  notify: Restart Fail2Ban

- name: Enable and start Fail2Ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

# ==========================================================
# Phase 4: SSH Hardening
# ==========================================================
- name: Backup sshd_config before changes
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.bak
    remote_src: true
    force: false

- name: Disable root login via SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
  register: ssh_root_login
  notify: Restart SSH

- name: Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  register: ssh_password_auth
  notify: Restart SSH

# The lines above alone are NOT enough: sshd_config `Include`s sshd_config.d/*.conf near
# its TOP, and for sshd the FIRST value of a keyword wins. Ubuntu/cloud-init ships
# sshd_config.d/50-cloud-init.conf with `PasswordAuthentication yes`, which therefore
# silently overrode the `no` further down (seen on PROD: effective passwordauthentication
# yes, ~1700 password brute-force attempts/day). A 00- drop-in sorts before any other, so
# it wins regardless of what cloud-init or packages drop in later.
- name: Enforce SSH auth policy via an early drop-in (wins over 50-cloud-init.conf)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/hardening). Sorts first -> these values win.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    validate: '/usr/sbin/sshd -t -f %s'
  register: ssh_dropin
  notify: Restart SSH

- name: Check if critical settings changed
  ansible.builtin.set_fact:
    hardening_changed: "{{ ssh_root_login.changed or ssh_password_auth.changed or ssh_dropin.changed }}"

# Flush handlers so SSH restarts BEFORE UFW is enabled
- name: Apply SSH changes before enabling firewall
  ansible.builtin.meta: flush_handlers

# Check what sshd ACTUALLY uses (config files can override each other) — fail loudly
# instead of trusting the file edits above.
- name: Verify effective sshd auth policy
  ansible.builtin.command: /usr/sbin/sshd -T
  register: _sshd_effective
  changed_when: false
  check_mode: false
  failed_when: >-
    ('passwordauthentication no' not in _sshd_effective.stdout_lines) or
    ('permitrootlogin no' not in _sshd_effective.stdout_lines)

# ==========================================================
# Phase 5: UFW Firewall
# ==========================================================
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ hardening_ufw_allowed_ports }}"

- name: Allow full access from trusted IP ranges
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.from_ip | default('any') }}"
    interface: "{{ item.interface | default(omit) }}"
    direction: "{{ 'in' if item.interface is defined else omit }}"
    comment: "{{ item.comment }}"
  loop: "{{ hardening_ufw_full_access_ranges | default([], true) }}"

# ==========================================================
# Phase 5: Rollback Safety + Enable + Smoke Test
# ==========================================================
- name: Schedule auto-rollback in {{ hardening_rollback_delay_minutes }} minutes
  ansible.builtin.shell: |
    echo "ufw disable && cp /etc/ssh/sshd_config.bak /etc/ssh/sshd_config && systemctl restart ssh && echo 'ROLLBACK EXECUTED' >> /var/log/ansible-rollback.log" | at now + {{ hardening_rollback_delay_minutes }} minutes 2>&1
  register: at_job
  when: hardening_changed

- name: Extract rollback job ID
  ansible.builtin.set_fact:
    rollback_job_id: "{{ at_job.stdout | regex_search('job (\\d+)', '\\1') | first }}"
  when: hardening_changed

- name: Show rollback job info
  ansible.builtin.debug:
    msg: "Rollback job {{ rollback_job_id }} scheduled. Will auto-restore in {{ hardening_rollback_delay_minutes }} min if smoke test fails."
  when: hardening_changed

# --- Spamhaus DROP (see defaults): ipsets first, then the UFW rules that use them -------
- name: Spamhaus DROP ipsets
  when: hardening_spamhaus_drop_enabled | default(false) | bool
  block:
    - name: Install ipset
      ansible.builtin.apt:
        name: ipset
        state: present

    - name: Install the spamhaus-drop script
      ansible.builtin.copy:
        src: spamhaus-drop
        dest: /usr/local/sbin/spamhaus-drop
        owner: root
        group: root
        mode: "0755"

    - name: Install Spamhaus systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop: [spamhaus-ipset.service, spamhaus-drop-update.service, spamhaus-drop-update.timer]
      register: _spamhaus_units

    # Sets must exist BEFORE ufw (re)loads rules referencing them.
    - name: Create/restore the ipsets now and at every boot (before ufw)
      ansible.builtin.systemd:
        name: spamhaus-ipset.service
        enabled: true
        state: started
        daemon_reload: "{{ _spamhaus_units.changed }}"

    - name: Enable the daily list refresh
      ansible.builtin.systemd:
        name: spamhaus-drop-update.timer
        enabled: true
        state: started

    - name: Fill the sets right away if they are still empty (first run)
      ansible.builtin.shell: |
        set -o pipefail
        n=$(ipset list -t spamhaus-drop4 | awk '/Number of entries/ {print $NF}')
        if [ "${n:-0}" -eq 0 ]; then systemctl start spamhaus-drop-update.service && echo FILLED; fi
      register: _spamhaus_fill
      changed_when: "'FILLED' in _spamhaus_fill.stdout"

# --- Own blocklist (see defaults): ipsets first, then the UFW rules that use them ----------
- name: Own blocklist
  when: hardening_blocklist_enabled | default(true) | bool
  block:
    - name: Install ipset (blocklist)
      ansible.builtin.apt:
        name: ipset
        state: present

    - name: Install the blocklist script
      ansible.builtin.copy:
        src: blocklist
        dest: /usr/local/sbin/blocklist
        owner: root
        group: root
        mode: "0755"

    - name: Blocklist config directory
      ansible.builtin.file:
        path: /etc/blocklist
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Protected ranges the blocklist refuses (fail2ban ignoreip, full-access ranges)
      ansible.builtin.copy:
        dest: /etc/blocklist/protected.txt
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (roles/hardening) — never accepted on the blocklist
          {% for r in (hardening_fail2ban_ignoreip | default([])) + ((hardening_ufw_full_access_ranges | default([])) | map(attribute='from_ip') | select('defined') | list) %}
          {{ r }}
          {% endfor %}

    - name: Blocklist ipset unit (restore before ufw at boot)
      ansible.builtin.copy:
        dest: /etc/systemd/system/blocklist-ipset.service
        mode: "0644"
        content: |
          # Managed by Ansible (roles/hardening). Creates/restores the blocklist ipsets BEFORE ufw
          # starts — ufw's rule files reference them and would fail to load without them.
          [Unit]
          Description=Own blocklist ipsets (restore before ufw)
          DefaultDependencies=no
          After=local-fs.target
          Before=network-pre.target ufw.service
          Wants=network-pre.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/blocklist restore

          [Install]
          WantedBy=multi-user.target ufw.service
      register: _blocklist_unit

    - name: Create/restore the blocklist ipsets now and at every boot
      ansible.builtin.systemd:
        name: blocklist-ipset.service
        enabled: true
        state: started
        daemon_reload: "{{ _blocklist_unit.changed }}"
      when: not ansible_check_mode

    - name: Ansible's own entries = hardening_blocked_sources (a set; portal entries untouched)
      ansible.builtin.command:
        argv: "{{ ['/usr/local/sbin/blocklist', 'sync'] + (hardening_blocked_sources | map('string') | list) }}"
      register: _blocklist_sync
      changed_when: "'CHANGED' in _blocklist_sync.stdout"
      when: not ansible_check_mode

# ctstate NEW: only connections FROM a blocked source are dropped — replies to connections the
# server opens itself pass (an auto-blocked data-centre /24 may share a provider with the Storage
# Box, a registry or an API this host talks to).
- name: Automatic blocking of systematic attackers (blocklist-auto)
  when:
    - hardening_blocklist_enabled | default(true) | bool
    - hardening_blocklist_auto_enabled | default(false) | bool
  block:
    - name: Install blocklist-auto
      ansible.builtin.copy:
        src: blocklist-auto
        dest: /usr/local/sbin/blocklist-auto
        owner: root
        group: root
        mode: "0755"

    - name: blocklist-auto settings
      ansible.builtin.copy:
        dest: /etc/blocklist/auto.json
        owner: root
        group: root
        mode: "0644"
        content: "{{ hardening_blocklist_auto | combine({'enabled': true, 'dry_run': hardening_blocklist_auto_dry_run | bool}) | to_nice_json }}\n"

    - name: AbuseIPDB key for blocklist-auto (root only; removed when unset)
      ansible.builtin.copy:
        dest: /etc/blocklist/abuseipdb.key
        content: "{{ hardening_abuseipdb_api_key }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: hardening_abuseipdb_api_key | length > 0

    - name: No AbuseIPDB key -> no key file
      ansible.builtin.file:
        path: /etc/blocklist/abuseipdb.key
        state: absent
      when: hardening_abuseipdb_api_key | length == 0

    - name: blocklist-auto service + timer (hourly)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/blocklist-auto.{{ item.ext }}"
        mode: "0644"
        content: "{{ item.content }}"
      loop:
        - ext: service
          content: |
            # Managed by Ansible (roles/hardening)
            [Unit]
            Description=Put systematic attackers on the own blocklist
            After=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/sbin/blocklist-auto
            Nice=10
            IOSchedulingClass=idle
        - ext: timer
          content: |
            # Managed by Ansible (roles/hardening)
            [Unit]
            Description=Put systematic attackers on the own blocklist (hourly)

            [Timer]
            OnCalendar=hourly
            RandomizedDelaySec=5min
            Persistent=true

            [Install]
            WantedBy=timers.target
      loop_control: { label: "blocklist-auto.{{ item.ext }}" }
      register: _bla_units

    - name: Enable blocklist-auto
      ansible.builtin.systemd:
        name: blocklist-auto.timer
        enabled: true
        state: started
        daemon_reload: "{{ _bla_units.changed }}"
      when: not ansible_check_mode

- name: Switch blocklist-auto off where it is disabled
  ansible.builtin.systemd:
    name: blocklist-auto.timer
    enabled: false
    state: stopped
  failed_when: false
  when:
    - not (hardening_blocklist_auto_enabled | default(false) | bool)
    - not ansible_check_mode

- name: Drop (and log, rate-limited) own blocklist sources at the start of UFW's input chains
  ansible.builtin.blockinfile:
    path: "/etc/ufw/{{ item.file }}"
    marker: "# {mark} OWN BLOCKLIST"
    insertafter: "^# End required lines"
    block: |
      -A {{ item.chain }} -m set --match-set {{ item.set }} src ! --update-counters -m conntrack --ctstate NEW -m limit --limit {{ hardening_drop_log_limit }} -j LOG --log-prefix "[BLOCKLIST DROP] "
      -A {{ item.chain }} -m set --match-set {{ item.set }} src -m conntrack --ctstate NEW -j DROP
  loop:
    - { file: before.rules, chain: ufw-before-input, set: blocklist4 }
    - { file: before6.rules, chain: ufw6-before-input, set: blocklist6 }
  loop_control: { label: "{{ item.file }}" }
  when: hardening_blocklist_enabled | default(true) | bool
  notify: Reload UFW

- name: Drop Spamhaus DROP sources at the start of UFW's input chains (v4 + v6)
  ansible.builtin.blockinfile:
    path: "/etc/ufw/{{ item.file }}"
    marker: "# {mark} SPAMHAUS DROP"
    insertafter: "^# End required lines"
    block: |
      -A {{ item.chain }} -m set --match-set {{ item.set }} src -m limit --limit {{ hardening_drop_log_limit }} -j LOG --log-prefix "[SPAMHAUS DROP] "
      -A {{ item.chain }} -m set --match-set {{ item.set }} src -j DROP
  loop:
    # NB: the IPv6 file names its chains ufw6-*, not ufw-*
    - { file: before.rules, chain: ufw-before-input, set: spamhaus-drop4 }
    - { file: before6.rules, chain: ufw6-before-input, set: spamhaus-drop6 }
  loop_control: { label: "{{ item.file }}" }
  when: hardening_spamhaus_drop_enabled | default(false) | bool
  notify: Reload UFW

- name: Configure Docker-UFW compatibility (DOCKER-USER chain)
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} DOCKER UFW COMPAT"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      {% if hardening_spamhaus_drop_enabled | default(false) | bool %}
      -A DOCKER-USER -m set --match-set spamhaus-drop4 src -j DROP
      {% endif %}
      {% if hardening_blocklist_enabled | default(true) | bool %}
      -A DOCKER-USER -m set --match-set blocklist4 src -m conntrack --ctstate NEW -j DROP
      {% endif %}
      -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      {% for item in hardening_ufw_full_access_ranges | default([]) %}
      {% if item.interface is defined %}
      -A DOCKER-USER -i {{ item.interface }} -j RETURN
      {% endif %}
      -A DOCKER-USER -s {{ item.from_ip | default('any') }} -j RETURN
      {% endfor %}
      -A DOCKER-USER -s 172.16.0.0/12 -j RETURN
      {% for p in hardening_docker_public_ports | default([]) %}
      -A DOCKER-USER -p {{ p.proto | default('tcp') }} --dport {{ p.port }} -j RETURN
      {% endfor %}
      -A DOCKER-USER -j DROP
      COMMIT
  when: hardening_docker_ufw_compat | default(true) | bool
  notify: Reload UFW

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Smoke test - verify SSH connectivity
  ansible.builtin.wait_for_connection:
    delay: 3
    timeout: 30

- name: Cancel auto-rollback
  ansible.builtin.command: atrm {{ rollback_job_id }}
  register: atrm_result
  failed_when: false
  when: hardening_changed

- name: Verify rollback job is gone
  ansible.builtin.shell: atq | grep -q "^{{ rollback_job_id }}\s"
  register: atq_check
  failed_when: false
  when: hardening_changed

- name: Warn if rollback job still exists
  ansible.builtin.debug:
    msg: >
      WARNING: Rollback job {{ rollback_job_id }} could not be cancelled!
      The server will auto-rollback in {{ hardening_rollback_delay_minutes }} minutes.
      Manually run: sudo atrm {{ rollback_job_id }}
  when: hardening_changed and atq_check.rc == 0

- name: Hardening complete (with changes)
  ansible.builtin.debug:
    msg: >
      Server hardening complete. SSH connectivity verified.
      Rollback job cancelled.
      Root login: disabled | Password auth: disabled |
      UFW: enabled | Fail2Ban: enabled
  when: hardening_changed and (atq_check.rc | default(1)) != 0

- name: Hardening complete (no changes)
  ansible.builtin.debug:
    msg: "Server already hardened. No changes applied."
  when: not hardening_changed

# ==========================================================
# Remove harmful provider-image cron hacks
# Some VPS images (e.g. Contabo) ship hourly cron jobs that actively hurt
# performance: dropping the page cache ("free") forces every service to
# re-read everything from disk each hour (minutes of iowait spikes at :17),
# and hourly fstrim is pointless — the weekly fstrim.timer covers TRIM.
# ==========================================================
- name: Remove harmful provider-image cron.hourly hacks
  ansible.builtin.file:
    path: "/etc/cron.hourly/{{ item }}"
    state: absent
  loop:
    - free
    - fstrim

# ==========================================================
# Remove a leftover installer 'scratchuser' account. The Ubuntu installer forces
# creating an initial sudo user that we replace with admin_user/ansible later, so
# the throwaway account should not linger. state=absent is idempotent (never
# creates it; no-op when already gone). remove=true also drops its home dir;
# force=true removes it even if it still owns processes / is logged in.
# ==========================================================
- name: Remove the leftover installer 'scratchuser' account
  ansible.builtin.user:
    name: "{{ hardening_scratchuser | default('scratchuser') }}"
    state: absent
    remove: true
    force: true
