---
# Provision the persistent data-domain roots (business / dev / authentik).
#
# TWO LAYERS, per the design rule:
#   - Data directories are created ALWAYS (filesystem-agnostic) so the service roles
#     can place their data there whether or not btrfs/snapshots are in play.
#   - ON btrfs WITH snapshots enabled (true/auto+btrfs), each domain root becomes its
#     own SUBVOLUME (@<name>) with a flat @<name>_snapshots + snapper config (daily,
#     kept {{ data_snapshot_timeline_daily }} days) + nodatacow on the DB subdirs.
#   - btrfs_snapshots_enable=true REQUIRES btrfs; auto/false run fine on ext4 (plain dirs).
- name: Storage mode facts
  ansible.builtin.set_fact:
    _stor_off: "{{ (btrfs_snapshots_enable is boolean) and (not btrfs_snapshots_enable) }}"
    _stor_req: "{{ (btrfs_snapshots_enable is boolean) and btrfs_snapshots_enable }}"

- name: Detect the filesystem at the data root
  ansible.builtin.command: "findmnt -no FSTYPE --target {{ data_root }}"
  register: _stor_fs
  changed_when: false
  check_mode: false

- name: Resolve whether to use subvolumes
  ansible.builtin.set_fact:
    _stor_is_btrfs: "{{ (_stor_fs.stdout | trim) == 'btrfs' }}"
    _stor_subvols: "{{ ((_stor_fs.stdout | trim) == 'btrfs') and not (_stor_off | bool) }}"

- name: Require btrfs for data subvolumes (btrfs_snapshots_enable=true)
  ansible.builtin.assert:
    that: _stor_is_btrfs | bool
    fail_msg: >-
      btrfs_snapshots_enable=true, but {{ data_root }} is '{{ _stor_fs.stdout | trim }}', not
      btrfs. Data subvolumes need btrfs — reinstall on btrfs, or set the switch to auto/false.
    success_msg: "{{ data_root }} is btrfs — provisioning data subvolumes."
    quiet: true
  when: _stor_req | bool

# Extra block devices join the root btrfs first, so everything below already has the space.
- name: Extra block devices for the root btrfs
  ansible.builtin.include_tasks: extra_devices.yml
  loop: "{{ btrfs_extra_devices | default([]) }}"
  loop_control: { loop_var: _xdev }
  when:
    - _stor_is_btrfs | bool
    - (btrfs_extra_devices | default([])) | length > 0

# With 2+ devices the metadata goes from DUP (twice on one device) to raid1 (once on each) —
# same space, survives either device. A one-time balance of the metadata only (minutes).
- name: Metadata raid1 across the devices (once)
  ansible.builtin.shell: |
    set -euo pipefail
    n="$(btrfs filesystem show / | grep -c 'devid')"
    prof="$(btrfs filesystem df / | awk -F'[,:]' '/^Metadata/ {gsub(/ /, "", $2); print $2}')"
    if [ "$n" -ge 2 ] && [ "$prof" != RAID1 ]; then
      {% if ansible_check_mode %}echo "WOULD CONVERT metadata $prof -> raid1"{% else %}btrfs balance start -mconvert=raid1,soft / >/dev/null; echo "CONVERTED metadata $prof -> raid1"{% endif %}
    else
      echo "OK metadata $prof on $n device(s)"
    fi
  args:
    executable: /bin/bash
  register: _stor_meta
  changed_when: "'CONVERTED' in _stor_meta.stdout"
  check_mode: false
  when:
    - _stor_is_btrfs | bool
    - (btrfs_extra_devices | default([])) | length > 0

- name: Ensure the base data root exists
  ansible.builtin.file:
    path: "{{ data_root }}"
    state: directory
    mode: "0755"

# ext4 / snapshots off: the domain roots are just plain directories.
- name: Ensure domain roots as plain directories (no btrfs subvolumes)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ data_domains }}"
  loop_control: { label: "{{ item.name }}" }
  when: not (_stor_subvols | bool)

# btrfs + enabled: each domain root becomes a subvolume with flat snapshots + snapper.
- name: Provision btrfs subvolume + snapper per domain
  ansible.builtin.include_tasks: domain_btrfs.yml
  loop: "{{ data_domains }}"
  loop_control: { loop_var: _dom, label: "{{ _dom.name }}" }
  when: _stor_subvols | bool
