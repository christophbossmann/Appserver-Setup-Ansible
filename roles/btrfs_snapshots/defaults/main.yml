---
# === BTRFS snapshot role (checkpoints only) ===================================
# This role ONLY takes deploy-time checkpoint snapshots. It expects the host to be
# already prepared for btrfs snapshots (the @-layout + snapper + grub-btrfs), done
# once by ./btrfs-bootstrap.sh — NOT by Ansible. See the role README + btrfs-setup.md.
#
# Three-way switch:
#   true   -> snapshots MUST work: FAIL if the host isn't set up (run btrfs-bootstrap.sh)
#   auto   -> if-possible (DEFAULT): create when set up, else skip with a warning
#   false  -> always skip (no checkpoints)
btrfs_snapshots_enable: auto

# Which mounted path decides "is this a btrfs snapshot host?" — usually the OS root.
btrfs_check_path: "/"

# Which snapper config the named checkpoint snapshots (ans_before_hardening, ...) use —
# the OS root by default. This config must already exist (created by btrfs-bootstrap.sh).
# NOTE: the checkpoints are created via the server's 'snapshot' helper, which is root-
# scoped — so keep this 'root' (it's only used here for the readiness/exists check).
btrfs_checkpoint_config: root

# Skip creating a checkpoint if one with the same label already exists (any timestamp)
# -> at most one ans_<label>_* per host, no accumulation on repeat deploys. Set false to
# create a fresh timestamped snapshot every run.
btrfs_checkpoint_skip_if_exists: true
