---
# After the nextcloud stack came up on the box data: leave maintenance mode and let Nextcloud
# re-read the files (finds anything the copy changed, e.g. mtimes) — only after a migration.
- name: Finish the migration onto the box
  when:
    - nextcloud_data_external | default(false) | bool
    - _ncs_migrated | default(false) | bool
    - not ansible_check_mode
  block:
    - name: Wait until Nextcloud answers occ
      ansible.builtin.command: docker exec -u www-data nextcloud php occ status --output=json
      register: _ncs_status
      changed_when: false
      retries: 30
      delay: 5
      until: _ncs_status.rc == 0

    - name: Maintenance mode off
      ansible.builtin.command: docker exec -u www-data nextcloud php occ maintenance:mode --off
      changed_when: true

    - name: Re-scan all files
      ansible.builtin.command: docker exec -u www-data nextcloud php occ files:scan --all
      register: _ncs_scan
      changed_when: true

    - name: Scan result
      ansible.builtin.debug:
        msg: "{{ _ncs_scan.stdout_lines[-6:] }}"
