---
# Image convention (repo-wide): templates reference ONLY <name>_image;
# <service>_version is the bump knob the _image default is composed from.

# Prometheus
prometheus_version: "v3.12.0"
prometheus_image: "prom/prometheus:{{ prometheus_version }}"
prometheus_port: 9090
# The time-series database rewrites its files all the time (compaction): inside the OS root
# every root snapshot would pin a stale copy — 13 GiB after one week on a small host. So it
# lives on the no-snapshot cache volume when cache_root is defined (roles/data_storage);
# nobody wants yesterday's metrics back after an OS rollback. Data found at a legacy
# location is moved once.
prometheus_data_dir: "{{ (cache_root ~ '/prometheus') if cache_root is defined else '/opt/monitoring/prometheus-data' }}"
prometheus_data_legacy_dirs: [/opt/monitoring/prometheus-data]
# Host metrics (node-exporter) are cheap — 15s is fine. cadvisor scrapes are
# EXPENSIVE (see comment in prometheus.yml.j2) — 60s.
prometheus_scrape_interval: "15s"
cadvisor_scrape_interval: "60s"

# Node Exporter (host metrics)
node_exporter_version: "v1.12.1"
node_exporter_image: "prom/node-exporter:{{ node_exporter_version }}"
# blackbox_exporter: probes every hostname Caddy serves (list published by roles/caddy to
# /etc/prometheus-file-sd/caddy-probes.json) — up/down, status, latency, TLS expiry.
blackbox_exporter_version: "v0.28.0"
blackbox_exporter_image: "prom/blackbox-exporter:{{ blackbox_exporter_version }}"
blackbox_scrape_interval: 60s

# postgres_exporter: one per postgres instance RUNNING on this host (taken from
# postgres_pitr_instances, filtered by `docker ps` like roles/postgres_pitr), attached to
# that instance's docker network. Connects as a read-only `prom_exporter` role (names starting with pg_ are reserved by postgres) (member of
# the built-in pg_monitor: statistics only, no table data).
postgres_exporter_version: "v0.20.1"
postgres_exporter_image: "quay.io/prometheuscommunity/postgres-exporter:{{ postgres_exporter_version }}"
# Derived deterministically from an existing vault secret (no extra vault entry needed);
# re-applied with ALTER ROLE on every run, so a rotated base secret just follows along.
# Set pg_exporter_password explicitly (e.g. from the vault) to decouple it.
pg_exporter_password: "{{ (postgres_business_password ~ ':pg_exporter:' ~ inventory_hostname) | hash('sha256') }}"

# Host-side collectors writing .prom files for node_exporter's textfile collector
# (/var/lib/node_exporter/textfile, mounted read-only into the container).
#   security-metrics : sshd events, UFW blocks, fail2ban, effective sshd policy — every minute
#   disk-usage-metrics : du of the dirs below — feeds the "Disk usage" treemap
monitoring_security_metrics_enabled: true
#   access-metrics : Caddy access logs per served host (top IPs/paths, status classes) — every minute
monitoring_access_metrics_enabled: true
monitoring_disk_usage_enabled: true
monitoring_disk_usage_oncalendar: "hourly"
# <root>:<depth> — every directory exactly <depth> levels below <root> is measured.
# /srv depth 2 = each data subvolume (business/db, business/immich, pg-archive/<inst> ...).
# The Storage Box is slow over rclone (metadata only, dir cache helps) — depth 4 reaches
# <host root>/immich/library/<user> (one box per Immich user library).
monitoring_disk_usage_paths:
  - /srv:2
  - /opt:1
  - /var/lib/docker:1
  # where Docker keeps the IMAGES when it uses the containerd image store (the default on
  # new installs) — usually the biggest part, and not under /var/lib/docker
  - /var/lib/containerd:1
  - /var/log:1
  - /home:1
  - /mnt/storagebox:4

#   disk-discover-metrics : the list above is fixed — data in a place nobody listed stays
#   invisible. Once a night this walks every local filesystem completely and reports every
#   directory of at least the threshold, split as deep as it stays that big, plus how much of
#   the used space it could not attribute ("Largest directories anywhere" / "Not attributed").
monitoring_disk_discover_enabled: true
monitoring_disk_discover_oncalendar: "*-*-* 02:20:00"
monitoring_disk_discover_threshold_gib: 1

#   immich-storage-metrics : Immich DB <-> files consistency (orphans = on disk but in no DB
#   row, e.g. originals uploaded after the dump a restore came from; missing = DB row without
#   file, e.g. motion clips/thumbs after a restore). Read-only; path lists land in
#   /var/lib/immich-storage-check/{orphans,missing}-<dir>.txt on the host. Needs immich.
monitoring_immich_storage_enabled: "{{ 'immich' in (caddy_services | default({})) }}"
monitoring_immich_storage_oncalendar: "hourly"
monitoring_immich_storage_dirs: [library, upload, encoded-video, thumbs]

#   pitr-metrics : PITR archive state per instance (base backups count/oldest/newest, last
#   archived WAL, size) — "Database backups (PITR)" rows on the Immich + Postgres dashboards.
monitoring_pitr_metrics_enabled: "{{ postgres_pitr_enabled | default(false) }}"
monitoring_pitr_metrics_oncalendar: "*-*-* *:05:00"

#   updates-metrics : upgradable / security packages, held packages, reboot pending (apt-check,
#   /var/run/reboot-required) — the "Reboot pending" / "Security updates pending" hints. Hourly.
monitoring_updates_metrics_enabled: true
monitoring_updates_metrics_oncalendar: "hourly"
# job-summary-metrics : "what did the last run do" per scheduled job (journal of its last run,
#   one rule per job, else its last line) -> "Last run did" column of the Scheduled jobs dashboard
monitoring_job_summary_enabled: true
monitoring_job_summary_oncalendar: "*-*-* *:0/5:20"

#   snapshot-metrics : btrfs/snapper snapshots of every config — when taken, retention, and
#   how much space deleting them would free: per single snapshot and per SET (all of a
#   volume, all automatic ones but the newest, those older than 7 days) — "Disk snapshots"
#   dashboard + the snapshot page of the on-host portal. Estimated by SAMPLING the
#   filesystem's data (which subvolumes reference the extent at a random position), because
#   set sizes cannot be had by walking the trees and that walk takes over a minute per OS
#   snapshot. More samples = finer estimates, longer run (~7 ms each). Nightly + on demand
#   ("Measure now"). Does nothing without snapper.
monitoring_snapshot_metrics_enabled: true
monitoring_snapshot_metrics_oncalendar: "*-*-* 01:30:00"
monitoring_snapshot_metrics_samples: 60000      # ~7 min; one sample stands for (data size / samples)

#   trivy-metrics : CRITICAL/HIGH vulnerabilities of the images of all RUNNING containers
#   (trivy, pinned .deb, checksum-verified) — "Vulnerabilities" dashboard. No daemon: one
#   nightly run, memory-capped (a scan of a multi-GB image needs RAM + scratch space, so it
#   must not compete with the apps); NOT started at boot or on every deploy — only once
#   right after trivy was installed (first deploy / version bump). DB + scratch files go
#   to the no-snapshot cache subvolume when cache_root is defined.
monitoring_trivy_enabled: true
monitoring_trivy_version: "0.74.0"
monitoring_trivy_oncalendar: "*-*-* 03:40:00"
monitoring_trivy_cache_dir: "{{ (cache_root ~ '/trivy') if cache_root is defined else '/var/cache/trivy' }}"
monitoring_trivy_memory_max: "2G"
# "Would a version update help?" — per image repository the pattern (POSIX ERE, so [0-9] not
# \d) its VERSION tags follow. For running images whose tag matches, trivy-metrics lists the
# registry's tags, picks the newest within the running major ("same-major") and the newest
# overall if that is another major ("latest"), and scans both from the registry — the
# dashboard then shows what each update would actually remove. Nothing is pulled/redeployed.
# Images without a rule (or whose running tag does not match) are simply not compared.
# tags_from (optional): take the tag list from ANOTHER repository — for images that are
# released together, when the image's own repository has too many tags to list in time.
# major_parts (optional, default 1): how many leading numbers form the "major" version. 2 for
# calendar versions (authentik 2026.5.3): then "same-major" is the newest 2026.5.x, "next-major"
# the newest of the NEXT release line (2026.6.x — the step its upgrade path expects) and
# "latest" the newest overall.
monitoring_trivy_update_rules:
  - { image: "ghcr.io/immich-app/immich-server",              tags: '^v[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "ghcr.io/immich-app/immich-machine-learning",    tags: '^v[0-9]+\.[0-9]+\.[0-9]+$', tags_from: "ghcr.io/immich-app/immich-server" }
  - { image: "ghcr.io/immich-app/postgres",                   tags: '^[0-9]+-vectorchord[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "ghcr.io/goauthentik/server",                    tags: '^[0-9]{4}\.[0-9]+\.[0-9]+$', major_parts: 2 }
  - { image: "ghcr.io/goauthentik/ldap",                      tags: '^[0-9]{4}\.[0-9]+\.[0-9]+$', major_parts: 2 }
  - { image: "nextcloud",                                     tags: '^[0-9]+\.[0-9]+\.[0-9]+-apache$' }
  - { image: "ghcr.io/juanfont/headscale",                    tags: '^v[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "ghcr.io/tale/headplane",                        tags: '^[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "grafana/grafana",                               tags: '^[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "prom/prometheus",                               tags: '^v[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "prom/node-exporter",                            tags: '^v[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "prom/blackbox-exporter",                        tags: '^v[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "quay.io/prometheuscommunity/postgres-exporter", tags: '^v[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "ghcr.io/google/cadvisor",                       tags: '^v[0-9]+\.[0-9]+\.[0-9]+$' }
  - { image: "joohoi/acme-dns",                               tags: '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' }
  - { image: "valkey/valkey",                                 tags: '^[0-9]+$' }
  - { image: "postgres",                                      tags: '^[0-9]+-alpine$' }
  - { image: "amir20/dozzle",                                 tags: '^v[0-9]+$' }
  - { image: "binwiederhier/ntfy",                            tags: '^v[0-9]+\.[0-9]+\.[0-9]+$' }

# "Start new scan" button on the Vulnerabilities dashboard. Grafana cannot run host
# commands, so the button POSTs to /hooks/trivy-scan on Grafana's own (VPN-only) host name;
# Caddy passes that to the distro's `webhook` service on loopback, which has ONE hook:
# `systemctl start trivy-metrics`. No Grafana login is checked on that path — whoever can
# reach the internal Grafana route can start a scan (harmless: one run at a time, memory-capped).
monitoring_scan_button_enabled: true
monitoring_webhook_port: 9777

# Grafana plugins installed at container start (treemap for the "Disk usage" dashboard).
grafana_plugins:
  - marcusolsson-treemap-panel
# ...and with alerting on: Infinity (JSON APIs as a datasource) for the "Alerts overview"
# tables — Grafana's own rules API (every rule's last/next evaluation) and the healthchecks.io
# API (last/next ping of every check). Both read-only, see templates/infinity.yml.j2.
grafana_alerting_plugins:
  - yesoreyeram-infinity-datasource

# systemd units the node_exporter systemd collector reports (regex on the unit name) —
# feeds the "Scheduled jobs" dashboard: the scheduled timers/services this repo and the
# OS rely on, plus the long-running helpers docker-swap-sync + storagebox-mount.
node_exporter_systemd_units: >-
  (pg-pitr-backup|backup-restic|storagebox-backup-(thumbs|dumps)|trivy-metrics|snapshot-metrics|disk-discover-metrics|docker-prune|snapper-(timeline|cleanup|boot)|apt-daily(-upgrade)?|caddy-tailscale-cert-renew|fstrim|logrotate|dpkg-db-backup|docker-swap-sync|storagebox-mount)\.(service|timer)

# cAdvisor (per-container metrics; host-level metrics come from node_exporter)
cadvisor_version: "v0.60.6"
cadvisor_image: "ghcr.io/google/cadvisor:{{ cadvisor_version }}"
# cadvisor is EXPENSIVE by default (200%+ CPU on hosts with many containers,
# plus induced dockerd/containerd load). Tame it: slower housekeeping and the
# costly sub-metrics off. Per-container CPU/mem/net/disk — what the Grafana
# docker dashboard uses — remain fully available.
cadvisor_housekeeping_interval: "120s"
cadvisor_disabled_metrics: "percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,disk"

# Grafana
grafana_version: "13.2.3"
grafana_image: "grafana/grafana:{{ grafana_version }}"
grafana_port: 3000
grafana_data_dir: /opt/monitoring/grafana-data
grafana_admin_user: "admin"
grafana_admin_password: "changeme"

# Restricted access is enforced in Caddy per proxy_route via caddy_bind_interfaces and caddy_allowed_ranges.
# UFW/network-level restrictions are handled separately by the hardening role.

# Caddy route(s) for this role live in defaults/caddy_route.yml (loaded
# explicitly by the caddy role, not auto-loaded). Selected per host via caddy_services.

# =====================================================================================
# Alerting — Grafana alert rules -> ntfy (self-hosted, in this stack) on the phone
# =====================================================================================
# HOST-GATED: off unless monitoring_alerting_enabled is set in host_vars.
#
#   rules     provisioned from templates/alerting.yml.j2 (folder "Alerting" in Grafana,
#             read-only there — change them here). Three severities:
#               critical  immediately, also at night                -> ntfy priority high
#               warning   held during monitoring_alert_quiet_hours, sent when they end
#               info      daily hints, sent in the morning window   -> ntfy priority low
#   ntfy      own container (ntfy_*), reachable for the phone through the `ntfy` Caddy route
#             (caddy_services: ntfy: external). deny-all: only the declared users — ntfy_user
#             (the phone app, password vault_ntfy_password, read+write on the alert topic)
#             and `grafana` (token only, write-only on ntfy_topic).
#   watchdog  an always-firing rule that pings healthchecks.io (check
#             <healthchecks_prefix>-grafana-watchdog, roles/healthchecks) every few minutes —
#             only while Grafana evaluates, Prometheus answers and ntfy is reachable through
#             its public route. Any of those broken -> the pings stop -> healthchecks.io
#             alarms via ntfy.sh. A dead alerting path is itself alarmed.
monitoring_alerting_enabled: false

# Services whose outage is CRITICAL (alarm immediately, also at night); every other service
# that goes down is a WARNING. Matched against
#   - the first label of a probed Caddy hostname (authentik.<host> -> authentik),
#   - the docker compose project of a container (postgres-business, immich, ...),
#   - the container name (prometheus, grafana, ...).
monitoring_alert_critical_services:
  - authentik
  - nextcloud
  - immich
  - postgres-business
  - prometheus
  - grafana
  - ntfy
# A service is down when its probe fails / a container of it is gone for this long.
monitoring_alert_down_for_critical: 5m
monitoring_alert_down_for_warning: 10m
# Containers that may disappear without an alarm (regex on the container name). Compose
# one-off containers (docker compose run) are never watched. A container removed on purpose
# is reported for a day (it is "gone" until it drops out of the 24 h lookback).
monitoring_alert_container_ignore: "^$"

monitoring_alert_disk_warning_pct: 20            # free space per filesystem
monitoring_alert_disk_critical_pct: 10
monitoring_alert_memory_critical_pct: 5          # MemAvailable below this for 10 min
monitoring_alert_cert_warning_days: 14
monitoring_alert_cert_critical_days: 3
monitoring_alert_pitr_wal_max_hours: 3           # no WAL archived for this long (archive_timeout 1 h)
monitoring_alert_pitr_base_max_hours: 30         # newest base backup older than this (daily job)
monitoring_alert_box_thumbs_max_hours: 50        # Storage Box thumbnail mirror (nightly)
monitoring_alert_box_dumps_max_days: 5           # Storage Box database dumps (every 4 days)
monitoring_alert_restarts: 3                     # container starts within 30 min
monitoring_alert_image_max_age_days: 180         # info: image build older than this
monitoring_alert_unassigned_gib: 20              # info: disk space no directory accounts for
monitoring_alert_reboot_pending_days: 7          # info: the system asked for a reboot this long ago
monitoring_alert_security_pending_days: 3        # info: security updates pending this long
                                                 #   (unattended-upgrades installs them daily -> stuck)

# Warnings are held during these hours and sent when they end; daily hints are sent only in
# the info window (and repeated once a day while they hold). Local time of the timezone.
# These are only the DEFAULTS a fresh host starts with: the two intervals are editable in
# Grafana (Alerting -> Notification configuration -> Time intervals — e.g. the time zone
# while abroad) and a deploy keeps what is set there.
monitoring_alert_quiet_hours: { start: "22:00", end: "08:00" }
monitoring_alert_info_window: { start: "08:00", end: "09:00" }
monitoring_alert_timezone: Europe/Berlin

# ntfy (self-hosted push to the phone app; https://docs.ntfy.sh)
ntfy_version: "v2.31.1"
ntfy_image: "binwiederhier/ntfy:{{ ntfy_version }}"
ntfy_port: 2586
ntfy_uid: 2586                                   # unprivileged uid the container runs as (owns ntfy_data_dir)
ntfy_data_dir: /opt/monitoring/ntfy-data
ntfy_topic: "{{ healthchecks_prefix | default(inventory_hostname | lower) }}-alerts"
# Technical login of the phone app(s) — shared, independent of Authentik on purpose: ntfy
# has no OIDC/LDAP, and the alarm path must not depend on the SSO it may have to report.
ntfy_user: ntfy
ntfy_password: "{{ vault_ntfy_password | default('') }}"
# The grafana user only uses its token; its password is never typed. Both derived from an
# existing vault secret (like pg_exporter_password) — no extra vault entry.
ntfy_grafana_token: "tk_{{ ((grafana_admin_password ~ ':ntfy-token:' ~ inventory_hostname) | hash('sha256'))[:29] }}"
ntfy_grafana_password: "{{ (grafana_admin_password ~ ':ntfy-grafana:' ~ inventory_hostname) | hash('sha256') }}"
# iPhone only: ntfy forwards a poll request (message id only, no content) to this server,
# which wakes the app through Apple's push service — without it iOS delivers late.
# Leave empty for Android.
ntfy_upstream_base_url: ""

