---
# =============================================================================
# tailscale role
#
# Flow:
#   1. Always install Tailscale if missing.
#   2. If tailscale_enabled is false -> stop here (installed, nothing else).
#   3. Start tailscaled, then decide identity:
#        a. Server is ALREADY logged in  -> keep it (a live login always wins;
#                                           no relogin) unless reauth_force.
#        b. otherwise (or reauth_force)  -> interactive auth flow (prompt key /
#                                           -e tailscale_auth_key, then pause to
#                                           adjust the node).
#
# NOTE: this role does NOT back up / restore the node's tailscaled.state identity.
# On a rebuild the node re-enrols via an auth key (for a self-hosted Headscale: a
# cached reusable pre-auth key). The identity-preserving state backup/restore was
# intentionally removed — it only pays off when the control server is NOT co-located
# / not yours (Tailscale cloud, a remote Headscale, a future dev<->prod cross-join).
# See docs/tailscale-identity-backup.md for exactly how it worked and how to bring
# it back (same role + a few vars — no separate role needed for a single client).
# =============================================================================

- name: Check if Tailscale is already installed
  ansible.builtin.command: tailscale version
  register: tailscale_installed
  failed_when: false
  changed_when: false

- name: Install Tailscale
  when: tailscale_installed.rc != 0
  block:
    - name: Download Tailscale install script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: "0755"

    - name: Run Tailscale install script
      ansible.builtin.command: /tmp/tailscale-install.sh
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Clean up install script
      ansible.builtin.file:
        path: /tmp/tailscale-install.sh
        state: absent

- name: Tailscale configuration skipped (tailscale_enabled is false)
  ansible.builtin.debug:
    msg: "tailscale_enabled is false — Tailscale is installed but not configured, connected, or exported."
  when: not (tailscale_enabled | bool)

# ---------------------------------------------------------------------------
# Everything below only runs when the role is enabled.
# ---------------------------------------------------------------------------
- name: Configure, connect and export Tailscale
  when: tailscale_enabled | bool
  block:
    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    # --- step a: is the server ALREADY logged in? (a live login always wins) --
    - name: Check current Tailscale status
      ansible.builtin.command: tailscale status
      register: tailscale_status_pre
      changed_when: false
      failed_when: false

    - name: Determine whether the server is already logged in
      ansible.builtin.set_fact:
        tailscale_logged_in: "{{ tailscale_status_pre.rc == 0 and 'Logged out' not in tailscale_status_pre.stdout }}"

    - name: Decide the identity action
      ansible.builtin.set_fact:
        # interactive auth when: forcing reauth, OR the server is not logged in.
        tailscale_needs_auth: "{{ (tailscale_reauth_force | bool) or (not tailscale_logged_in) }}"

    - name: Keep the existing Tailscale login (live login wins, no relogin)
      ansible.builtin.debug:
        msg: "Server is already logged in to Tailscale — keeping it as-is (no relogin)."
      when: tailscale_logged_in and not (tailscale_reauth_force | bool)

    # A host that self-enrols into its OWN co-located headscale (tailscale_self_enrol)
    # must NOT try to enrol here — this role runs before docker/headscale exist. It
    # only installs + starts; the tailscale_enrol role does the enrolment later
    # (after headscale_bootstrap, before caddy). Avoids a hung prompt on fresh builds.
    - name: Defer enrolment to tailscale_enrol (co-located headscale)
      ansible.builtin.debug:
        msg: >-
          tailscale_self_enrol=true — {{ inventory_hostname }} enrols into its own
          headscale later (role tailscale_enrol). Installed + started only here.
      when:
        - tailscale_needs_auth | bool
        - tailscale_self_enrol | default(false) | bool

    # --- interactive auth flow ---------------------------------------------
    - name: Authenticate Tailscale (interactive)
      when:
        - tailscale_needs_auth | bool
        - not (tailscale_self_enrol | default(false) | bool)
      block:
        - name: Prompt for a Tailscale auth key
          ansible.builtin.pause:
            prompt: |

              ────────────────────────────────────────────────────────────
              No Tailscale login for
              host: {{ inventory_hostname }}
              (or re-auth was forced).

              Paste a Tailscale AUTH KEY and press ENTER.
              (Generate one at https://login.tailscale.com/admin/settings/keys)

              Leave empty + ENTER to skip and log in manually on the server.
              ────────────────────────────────────────────────────────────
          register: tailscale_authkey_prompt
          when: tailscale_auth_key | length == 0

        - name: Resolve the effective auth key
          ansible.builtin.set_fact:
            tailscale_effective_authkey: "{{ tailscale_auth_key if (tailscale_auth_key | length > 0) else (tailscale_authkey_prompt.user_input | default('')) }}"
          no_log: true

        - name: Connect to Tailscale
          # --login-server points the client at a control server. Empty (default)
          # = Tailscale's cloud (login.tailscale.com), i.e. unchanged behaviour.
          # Set tailscale_login_server to a self-hosted Headscale URL to join that
          # control server instead (the headscale stack is a SEPARATE building
          # block — this is the only knob that decides where THIS client connects).
          ansible.builtin.command: >
            tailscale up
            --authkey={{ tailscale_effective_authkey }}
            {{ ('--login-server=' + tailscale_login_server) if (tailscale_login_server | default('') | length > 0) else '' }}
            {{ tailscale_extra_args }}
            {{ '--force-reauth' if (tailscale_reauth_force | bool) else '' }}
          when: tailscale_effective_authkey | length > 0
          changed_when: true
          no_log: true

        - name: Pause to configure the node in the Tailscale admin console
          ansible.builtin.pause:
            prompt: |

              ────────────────────────────────────────────────────────────
              Tailscale is now authenticated for {{ inventory_hostname }}.

              Open https://login.tailscale.com/admin/machines and adjust this
              node as needed: confirm/rename it, disable key expiry, and set
              or note its Tailscale IP / aliases.

              Press ENTER when you are done to continue the playbook.
              ────────────────────────────────────────────────────────────
          when: tailscale_effective_authkey | length > 0

    # --- final status ------------------------------------------------------
    - name: Get final Tailscale status
      ansible.builtin.command: tailscale status
      register: tailscale_status
      changed_when: false
      failed_when: false

    - name: Show Tailscale status
      ansible.builtin.debug:
        msg: "{{ tailscale_status.stdout_lines }}"

    - name: Warn if Tailscale is still not connected
      ansible.builtin.debug:
        msg: >
          Tailscale is installed but not connected. Re-run with
          -e "tailscale_auth_key=tskey-auth-..." or log in on the server
          with: sudo tailscale up
      when: tailscale_status.rc != 0
