---
# =============================================================================
# tailscale role — defaults
# =============================================================================

# Master switch. When false, Tailscale is INSTALLED but nothing else happens
# (no start, no auth, no export). When true (default) the full flow runs.
tailscale_enabled: true

# Force re-authentication even if valid Tailscale state already exists.
# false (default): existing state is reused automatically, no prompts.
# true:            the interactive auth flow runs and `tailscale up
#                  --force-reauth` is issued.
tailscale_reauth_force: false

# Auth key. Leave empty to be prompted interactively during the run, or set it
# here / via -e "tailscale_auth_key=tskey-auth-..." to skip the prompt.
# Generate at: https://login.tailscale.com/admin/settings/keys
tailscale_auth_key: ""

# Extra args for `tailscale up` (e.g. "--advertise-exit-node" or "--accept-routes").
tailscale_extra_args: ""

# Control server this client connects to. Empty (default) = Tailscale's cloud
# (login.tailscale.com) — the current, unchanged behaviour. Set to a self-hosted
# Headscale URL (e.g. "https://headscale.{{ global_host }}") to point THIS host's
# tailscale client at that control server instead. The headscale stack (the host
# running its OWN controller) is a separate building block; this knob only decides
# where the client joins. Switching control servers needs a matching authkey and
# usually tailscale_reauth_force=true.
tailscale_login_server: ""

# NOTE: this role no longer backs up / restores the node's tailscaled.state
# identity (removed 2026-09-27). On a rebuild the node re-enrols via an auth key
# — for a self-hosted, co-located Headscale that is the cheap standard path and a
# changed IP self-heals (headscale_int_dns + Caddy tailscale0 bind derive from the
# live IP). Bring the mechanism back only for a control server that is NOT
# co-located / not yours (Tailscale cloud, remote Headscale, dev<->prod cross-join).
# The full removed implementation + how to reintroduce it lives in
# docs/tailscale-identity-backup.md.
